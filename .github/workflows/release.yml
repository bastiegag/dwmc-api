name: Release

on:
    push:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    version:
        name: Version backend and create release PR
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Validate backend
              run: npm run validate

            - name: Create or update Version PR
              id: changesets
              uses: changesets/action@v2
              with:
                  version-script: npm run version
                  publish-script: npm run release
                  commit-message: 'chore(release): version backend'
                  pr-title: 'chore(release): version backend'
                  setup-git-user: true
                  create-github-releases: true
                  push-git-tags: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
