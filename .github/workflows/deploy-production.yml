name: Deploy Production Migration

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]

# Only one production migration may run at a time; never cancel an in-flight
# production migration because another commit arrived.
concurrency:
    group: migrate-production
    cancel-in-progress: false

jobs:
    migrate:
        name: Apply Prisma migrations (production)
        if: github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        environment: production
        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Apply committed migrations
              run: npm run db:migrate:deploy
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
